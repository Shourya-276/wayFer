<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="wayferGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F076" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00F076" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Outer glowing beacon circle / dark disc -->
  <rect x="2" y="2" width="44" height="44" rx="14" fill="#0A0E17" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  
  <!-- Intersecting Route Paths forming dynamic 'W' & converge to destination -->
  <path d="M10 14L18 34L24 22L30 34L38 14" stroke="url(#wayferGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Convergence Destination Pin Dot -->
  <circle cx="24" cy="14" r="3.5" fill="#00F076" filter="url(#glow)"/>
  <circle cx="24" cy="14" r="1.5" fill="#030507" />
  
  <!-- Start origin nodes -->
  <circle cx="10" cy="14" r="2" fill="#22D3EE" />
  <circle cx="38" cy="14" r="2" fill="#00F076" />
</svg>
